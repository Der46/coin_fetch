<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Coin Rewards</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b5b"/>
      <stop offset="0.55" stop-color="#ff4848"/>
      <stop offset="1" stop-color="#d61f3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe173"/>
      <stop offset="1" stop-color="#d98a00"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.5" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#f29f05"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background so the icon also works as a maskable icon -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- Coin (kept inside the 80% maskable safe zone) -->
  <circle cx="256" cy="270" r="156" fill="#a85f00" opacity="0.35"/>
  <circle cx="256" cy="256" r="156" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="128" fill="url(#face)"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#d98a00" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.7"/>
  <path d="M168 196 A100 100 0 0 1 300 150" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.55"/>

  <!-- Lightning bolt: free spins -->
  <path d="M282 160 L198 270 H250 L230 352 L316 236 H262 Z" fill="#c2410c" transform="translate(4 6)" opacity="0.45"/>
  <path d="M282 160 L198 270 H250 L230 352 L316 236 H262 Z" fill="url(#bolt)" stroke="#e05a00" stroke-width="6" stroke-linejoin="round"/>

  <!-- Sparkles -->
  <path d="M388 112 L396 136 L420 144 L396 152 L388 176 L380 152 L356 144 L380 136 Z" fill="#ffffff"/>
  <path d="M126 356 L131 371 L146 376 L131 381 L126 396 L121 381 L106 376 L121 371 Z" fill="#ffffff" opacity="0.85"/>
</svg>
